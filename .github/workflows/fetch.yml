name: Fetch & Deploy

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:         # lets you click "Run workflow" in the Actions tab

# Only one run at a time. A new run waits for the current one to finish.
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30      # hard stop, a run can never go on for hours again

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser pyyaml

      - name: Run fetcher
        run: timeout 25m python fetch.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: eduradar update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github,fetch.py,sources.yaml,requirements.txt,README.md"
